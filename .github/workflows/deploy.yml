name: Build and deploy Rust staging

on:
  push:
    branches:
      - Test
  pull_request:
    paths:
      - 'rust-bot/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}
      digest: ${{ steps.build.outputs.digest }}
      published: ${{ steps.summary.outputs.published }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Set image name and publish policy
        id: image
        env:
          REPO: ${{ github.repository }}
          PUBLISH: ${{ github.ref == 'refs/heads/Test' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
        run: |
          echo "name=ghcr.io/${REPO,,}-rust" >> "$GITHUB_OUTPUT"
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        uses: docker/login-action@v3
        if: steps.image.outputs.publish == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and test Rust image
        uses: docker/build-push-action@v6
        id: build
        with:
          context: ./rust-bot
          platforms: linux/amd64
          push: ${{ steps.image.outputs.publish == 'true' }}
          outputs: ${{ steps.image.outputs.publish == 'false' && 'type=cacheonly' || '' }}
          tags: ${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha,scope=shobana-rust
          cache-to: type=gha,mode=max,scope=shobana-rust
      - name: Show published image path
        id: summary
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
          PUBLISH: ${{ steps.image.outputs.publish }}
        run: |
          set -euo pipefail
          if [[ "$PUBLISH" == true ]]; then
            if [[ ! "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]; then
              echo '::error::No valid digest was returned from the registry export.'
              exit 1
            fi
            echo 'published=true' >> "$GITHUB_OUTPUT"
            {
              echo '## GHCR image published'
              echo 'Paste this into Koyeb under **Source → Docker → Image path**:'
              printf '\n```text\n%s:%s\n```\n' "$IMAGE" "$GITHUB_SHA"
              printf '\nImmutable image reference: `%s@%s`\n' "$IMAGE" "$DIGEST"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'published=false' >> "$GITHUB_OUTPUT"
            echo 'Rust image built and tested, but not published. Only runs on `Test` can publish.' >> "$GITHUB_STEP_SUMMARY"
          fi

  deploy-staging:
    if: ${{ needs.build.outputs.published == 'true' && vars.RUST_AUTO_DEPLOY == 'true' }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: rust-staging
    concurrency:
      group: koyeb-rust-staging
      cancel-in-progress: false
    steps:
      - name: Install Koyeb CLI
        env:
          VERSION: '5.12.0'
          SHA256: c39ce972e48c641368d4c09e98fbe6f3b7ae210687db2ed1de706299b7a8534a
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          archive="koyeb-cli_${VERSION}_linux_amd64.tar.gz"
          release="https://github.com/koyeb/koyeb-cli/releases/download/v${VERSION}"
          curl -fsSLO "$release/$archive"
          printf '%s  %s\n' "$SHA256" "$archive" | sha256sum --strict --check
          mkdir -p "$RUNNER_TEMP/koyeb-bin"
          tar xzf "$archive" -C "$RUNNER_TEMP/koyeb-bin" koyeb
          echo "$RUNNER_TEMP/koyeb-bin" >> "$GITHUB_PATH"
      - name: Deploy the published image by digest
        env:
          KOYEB_TOKEN: ${{ secrets.KOYEB_TOKEN }}
          KOYEB_SERVICE: ${{ vars.KOYEB_SERVICE }}
          REGISTRY_SECRET: ${{ vars.KOYEB_REGISTRY_SECRET }}
          IMAGE: ${{ needs.build.outputs.image }}
          DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          set -euo pipefail
          : "${KOYEB_TOKEN:?configure KOYEB_TOKEN in the rust-staging environment}"
          [[ "$KOYEB_SERVICE" =~ ^[a-z0-9-]+/[a-z0-9-]+$ ]] || { echo 'Set KOYEB_SERVICE to the staging app/service'; exit 1; }
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          args=(--docker "$IMAGE@$DIGEST" --wait)
          if [[ -n "$REGISTRY_SECRET" ]]; then
            args+=(--docker-private-registry-secret "$REGISTRY_SECRET")
          fi
          koyeb service update "$KOYEB_SERVICE" "${args[@]}"
